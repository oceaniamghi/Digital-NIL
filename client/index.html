// ── API helper ───────────────────────────────────────────────────────────────
const API_BASE='/api';
async function api(method,path,body,token){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(token)opts.headers['Authorization']=`Bearer ${token}`;
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API_BASE+path,opts);
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||'Request failed');
  return data;
}
async function apiUpload(path,formData,token){
  const r=await fetch(API_BASE+path,{method:'POST',headers:{Authorization:`Bearer ${token}`},body:formData});
  const data=await r.json();
  if(!r.ok)throw new Error(data.error||'Upload failed');
  return data;
}

  const bg=colors[(name.charCodeAt(0)||0)%colors.length];
  if(src)return React.createElement('img',{src,style:{width:size,height:size,borderRadius:'50%',objectFit:'cover',...s}});
  return React.createElement('div',{style:{width:size,height:size,borderRadius:'50%',background:bg,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:size*0.38,fontWeight:700,...s}},initials);
};

function formatMoney(n){return n>=1000?`$${(n/1000).toFixed(1)}k`:`$${n?.toLocaleString()||0}`;}
function formatNum(n){if(!n)return'0';if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(n);}
function timeAgo(d){
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(s<60)return'just now';if(s<3600)return`${Math.floor(s/60)}m ago`;
  if(s<86400)return`${Math.floor(s/3600)}h ago`;return`${Math.floor(s/86400)}d ago`;
}

const App=()=>{
  const[user,setUser]=useState(null);
  const[token,setToken]=useState(null);
  const[view,setView]=useState('dashboard');
  const[unread,setUnread]=useState(0);
  const[booting,setBooting]=useState(true);
  const socketRef=useRef(null);

  // Boot — restore session
  useEffect(()=>{
    const t=localStorage.getItem('as_token');
    if(!t){setBooting(false);return;}
    api('GET','/auth/me',null,t)
      .then(d=>{setUser(d.user);setToken(t);})
      .catch(()=>localStorage.removeItem('as_token'))
      .finally(()=>setBooting(false));
  },[]);

  // Poll unread count
  useEffect(()=>{
    if(!token)return;
    const poll=()=>api('GET','/activity/unread-count',null,token).then(d=>setUnread(d.count||0)).catch(()=>{});
    poll();
    const iv=setInterval(poll,30000);
    return()=>clearInterval(iv);
  },[token]);

  // Socket.io
  useEffect(()=>{
    if(!user)return;
    try{
      const socket=window.io?window.io():null;
      if(!socket)return;
      socketRef.current=socket;
      socket.emit('join',user._id);
      socket.on('notification',()=>setUnread(u=>u+1));
      return()=>socket.disconnect();
    }catch(e){}
  },[user]);

  const onAuth=(u,t)=>{setUser(u);setToken(t);setView('dashboard');};
  const onLogout=()=>{localStorage.removeItem('as_token');setUser(null);setToken(null);setView('dashboard');};
  const onUpdate=(u)=>setUser(u);

  if(booting)return React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'100vh',flexDirection:'column',gap:12}},
    React.createElement('div',{style:{width:40,height:40,background:C.primary,borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',fontSize:24}},'🏈'),
    React.createElement(Spinner));

  if(!user)return React.createElement(AuthCtx.Provider,{value:{user,token}},React.createElement(AuthScreen,{onAuth}));

  const renderView=()=>{
    switch(view){
      case'dashboard':return React.createElement(Dashboard,{token,user,onNavigate:setView});
      case'opportunities':return React.createElement(Opportunities,{token,user});
      case'my-deals':return React.createElement(MyDeals,{token,user});
      case'content':return React.createElement(ContentHub,{token,user});
