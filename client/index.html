<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#1E1E1E"/>
<title>Digital NIL — Athlete Marketing Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#1E1E1E}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:#D4D4D4;min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{cursor:pointer;border:none;font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#1E1E1E}
::-webkit-scrollbar-thumb{background:#2A2A2A;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3A3939}
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;vertical-align:middle;line-height:1}
.mi-fill{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.05em}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const {useState,useEffect,useRef,useCallback,createContext,useContext}=React;

// ── Theme constants (VSCode Dark — black / white / dark gray monochrome) ─────
const C={
  primary:'#4D4D4D',primaryDark:'#5A5A5A',primaryLight:'rgba(255,255,255,.08)',primarySoft:'rgba(255,255,255,.12)',
  primaryFg:'#FFFFFF',
  success:'#4EC9B0',successLight:'rgba(78,201,176,.12)',successFg:'#4EC9B0',
  warning:'#CCA700',warningLight:'rgba(204,167,0,.12)',warningFg:'#D7BA7D',
  danger:'#F14C4C',dangerLight:'rgba(241,76,76,.12)',dangerFg:'#F48771',
  bg:'#1E1E1E',bgDeep:'#181818',surface:'#252526',surfaceDim:'#2D2D30',surface1:'#2D2D30',surface2:'#3C3C3C',surface3:'#4D4D4D',
  glass:'rgba(37,37,38,.78)',glassHi:'rgba(45,45,48,.85)',
  border:'rgba(255,255,255,.10)',borderHi:'rgba(255,255,255,.16)',borderRed:'rgba(255,255,255,.22)',
  textPrimary:'#FFFFFF',text:'#D4D4D4',textSecondary:'#A0A0A0',textMuted:'#6E6E6E',
  sidebar:'#252526',sidebarHover:'rgba(255,255,255,.06)',sidebarActive:'#37373D'
};

// ── Global styles injected ───────────────────────────────────────────────────
const style=document.createElement('style');
style.textContent=`
:root{
  --bg:${C.bg};--surface:${C.surface};--glass:${C.glass};--border:${C.border};
  --primary:${C.primary};--success:${C.success};--warning:${C.warning};--danger:${C.danger};
  --text:${C.text};--text-muted:${C.textMuted};--text-secondary:${C.textSecondary};
  --mobile-pad:16px;--desktop-pad:28px;--container:1140px;--stack:28px;
}
body{background:${C.bg};color:${C.text};overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(60% 50% at 80% 0%,rgba(255,255,255,.10) 0%,transparent 60%),
             radial-gradient(50% 40% at 0% 100%,rgba(255,255,255,.06) 0%,transparent 60%)}
#root{position:relative;z-index:2}

/* ── Weather ambient backdrop ──────────────────────────────────────────────── */
.wx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;transition:opacity 1.4s}
.wx-clear{background:radial-gradient(60% 50% at 70% 10%,rgba(120,92,40,.07) 0%,transparent 60%),radial-gradient(40% 30% at 20% 80%,rgba(60,80,130,.05) 0%,transparent 60%)}
.wx-night{background:radial-gradient(70% 60% at 50% -10%,rgba(60,80,180,.12) 0%,transparent 60%),radial-gradient(40% 30% at 80% 90%,rgba(160,80,200,.08) 0%,transparent 60%)}
.wx-sun{position:absolute;top:-120px;right:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(150,105,45,.22) 0%,rgba(90,60,28,.10) 35%,transparent 70%);filter:blur(3px);animation:wx-sun-pulse 12s ease-in-out infinite}
@keyframes wx-sun-pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.wx-moon{position:absolute;top:80px;right:120px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(220,220,255,.45) 0%,rgba(140,160,220,.18) 40%,transparent 70%);filter:blur(1px);animation:wx-sun-pulse 18s ease-in-out infinite}
.wx-cloud{position:absolute;background:radial-gradient(ellipse at 50% 50%,rgba(34,38,52,.50) 0%,rgba(24,26,38,.28) 40%,transparent 70%);border-radius:50%;filter:blur(20px)}
.wx-cloud.c1{width:520px;height:260px;top:8%;left:-200px;animation:wx-cloud-drift 80s linear infinite}
.wx-cloud.c2{width:680px;height:300px;top:32%;left:30%;animation:wx-cloud-drift 120s linear infinite reverse;opacity:.7}
.wx-cloud.c3{width:440px;height:220px;top:60%;right:-150px;animation:wx-cloud-drift 100s linear infinite;opacity:.85}
.wx-cloud.dark{background:radial-gradient(ellipse at 50% 50%,rgba(40,45,60,.55) 0%,rgba(30,32,46,.30) 40%,transparent 70%)}
@keyframes wx-cloud-drift{0%{transform:translateX(0)}100%{transform:translateX(40vw)}}
.wx-rain,.wx-snow{position:absolute;inset:0;overflow:hidden}
.wx-rain::before,.wx-rain::after{content:'';position:absolute;inset:-50% -50% -50% -50%;background-image:repeating-linear-gradient(100deg,transparent 0 12px,rgba(120,140,180,.07) 12px 13px);animation:wx-rain-fall 1.1s linear infinite}
.wx-rain::after{animation-duration:.8s;opacity:.5;background-image:repeating-linear-gradient(100deg,transparent 0 18px,rgba(110,130,170,.08) 18px 19px)}
@keyframes wx-rain-fall{from{transform:translate3d(0,-30%,0)}to{transform:translate3d(-30%,30%,0)}}
.wx-snow::before,.wx-snow::after{content:'';position:absolute;inset:-50%;background-image:radial-gradient(circle 1.5px at 10px 20px,rgba(255,255,255,.7) 50%,transparent 60%),radial-gradient(circle 1px at 50px 80px,rgba(255,255,255,.6) 50%,transparent 60%),radial-gradient(circle 2px at 130px 40px,rgba(255,255,255,.8) 50%,transparent 60%),radial-gradient(circle 1px at 200px 100px,rgba(255,255,255,.5) 50%,transparent 60%),radial-gradient(circle 1.5px at 280px 60px,rgba(255,255,255,.7) 50%,transparent 60%);background-size:300px 200px;animation:wx-snow-fall 14s linear infinite}
.wx-snow::after{animation-duration:22s;background-position:80px 0;opacity:.5}
@keyframes wx-snow-fall{from{transform:translate3d(0,-200px,0)}to{transform:translate3d(40px,calc(100vh + 200px),0)}}
.wx-fog{position:absolute;inset:0;background:linear-gradient(180deg,rgba(180,190,210,.04) 0%,rgba(180,190,210,.10) 40%,rgba(140,150,170,.06) 80%,transparent 100%);animation:wx-fog-pulse 22s ease-in-out infinite}
@keyframes wx-fog-pulse{0%,100%{opacity:.6}50%{opacity:1}}
.wx-thunder{position:absolute;inset:0;background:rgba(220,230,255,.0);animation:wx-flash 9s linear infinite}
@keyframes wx-flash{0%,93%,100%{background:rgba(220,230,255,0)}94%{background:rgba(220,230,255,.18)}95%{background:rgba(220,230,255,0)}96%{background:rgba(220,230,255,.12)}97%{background:rgba(220,230,255,0)}}
.wx-stars{position:absolute;inset:0;background-image:radial-gradient(circle 1px at 10% 20%,rgba(255,255,255,.6) 50%,transparent 60%),radial-gradient(circle 1px at 40% 80%,rgba(255,255,255,.5) 50%,transparent 60%),radial-gradient(circle 1px at 70% 30%,rgba(255,255,255,.7) 50%,transparent 60%),radial-gradient(circle 1px at 85% 65%,rgba(255,255,255,.4) 50%,transparent 60%),radial-gradient(circle 1px at 25% 50%,rgba(255,255,255,.5) 50%,transparent 60%);background-size:600px 400px;opacity:.8;animation:wx-twinkle 6s ease-in-out infinite}
@keyframes wx-twinkle{0%,100%{opacity:.5}50%{opacity:.95}}
.wx-badge{position:fixed;left:80px;bottom:18px;display:flex;align-items:center;gap:8px;padding:6px 12px;background:${C.glass};backdrop-filter:blur(24px);border:1px solid ${C.border};border-radius:999px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:${C.textSecondary};z-index:55;pointer-events:none}
@media(max-width:768px){.wx-badge{left:14px;bottom:88px}}

.glass{background:${C.glass};backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid ${C.border}}
.card{position:relative;background:rgba(37,37,38,.40);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid ${C.border};border-radius:16px;padding:20px;transition:border-color .25s,transform .25s,box-shadow .25s}
.card-hover:hover{transform:translateY(-2px);border-color:${C.borderRed};box-shadow:0 8px 32px rgba(255,255,255,.10)}
.card-accent{position:relative;overflow:hidden}
.card-accent::before{content:'';position:absolute;left:0;top:0;width:2px;height:100%;background:${C.primary}}
.stat-card{position:relative;background:rgba(37,37,38,.40);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid ${C.border};border-radius:16px;padding:18px 18px;overflow:hidden}
.stat-card::before{content:'';position:absolute;left:0;top:0;width:2px;height:100%;background:${C.primary}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;transition:all .15s;border:1px solid transparent;letter-spacing:.01em}
.btn:active{transform:scale(.97)}
.btn-primary{background:${C.primary};color:#FFFFFF;box-shadow:0 0 0 0 rgba(255,255,255,.0)}
.btn-primary:hover{background:${C.primaryDark};box-shadow:0 4px 24px rgba(255,255,255,.14)}
.btn-secondary{background:${C.surface1};color:${C.text};border-color:${C.border}}
.btn-secondary:hover{background:${C.surface2};border-color:${C.borderHi}}
.btn-danger{background:${C.danger};color:#fff}.btn-danger:hover{filter:brightness(1.08)}
.btn-success{background:${C.success};color:#031}.btn-success:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;color:${C.textSecondary};padding:8px 12px}.btn-ghost:hover{background:rgba(255,255,255,.05);color:${C.text}}
.btn-glass{background:${C.glass};backdrop-filter:blur(24px);color:${C.text};border:1px solid ${C.border}}.btn-glass:hover{border-color:${C.borderHi};background:${C.glassHi}}

.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,monospace;border:1px solid transparent}
.badge .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.badge-blue{background:rgba(160,160,160,.10);color:#A0A0A0;border-color:rgba(160,160,160,.20)}
.badge-green{background:${C.successLight};color:${C.success};border-color:rgba(78,201,176,.20);box-shadow:0 0 15px rgba(78,201,176,.10)}
.badge-green .dot{background:${C.success};animation:pulse 2s infinite}
.badge-yellow{background:${C.warningLight};color:${C.warning};border-color:rgba(255,204,0,.20)}
.badge-yellow .dot{background:${C.warning}}
.badge-red{background:${C.dangerLight};color:${C.dangerFg};border-color:rgba(255,85,102,.20)}
.badge-gray{background:${C.surface1};color:${C.textSecondary};border-color:${C.border}}
.badge-purple{background:rgba(176,140,255,.10);color:#C8B4FF;border-color:rgba(176,140,255,.20)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.input{width:100%;padding:11px 14px;border:1px solid ${C.border};border-radius:10px;font-size:14px;outline:none;transition:border .15s,box-shadow .15s;background:${C.surfaceDim};color:${C.text}}
.input::placeholder{color:${C.textMuted}}
.input:focus{border-color:${C.primary};box-shadow:0 0 0 3px ${C.primaryLight}}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,${C.textSecondary} 50%),linear-gradient(135deg,${C.textSecondary} 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
.label{display:block;font-size:11px;font-weight:700;color:${C.textSecondary};margin-bottom:8px;letter-spacing:.06em;text-transform:uppercase;font-family:'JetBrains Mono',ui-monospace,monospace}
.divider{height:1px;background:${C.border};margin:16px 0}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.modal{background:${C.surfaceDim};border:1px solid ${C.border};border-radius:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:24px;color:${C.text};box-shadow:0 24px 64px rgba(0,0,0,.6)}
@keyframes fade{from{opacity:0}to{opacity:1}}

.avatar{border-radius:50%;object-fit:cover;background:${C.surface2};display:flex;align-items:center;justify-content:center;font-weight:700;color:#FFFFFF;flex-shrink:0}

.tabs-pill{display:inline-flex;align-items:center;gap:4px;padding:4px;background:${C.surfaceDim};border:1px solid ${C.border};border-radius:12px}
.tabs-pill button{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:${C.textSecondary};background:transparent;transition:all .15s;letter-spacing:.01em}
.tabs-pill button.active{background:${C.primary};color:#fff;box-shadow:0 0 16px rgba(255,255,255,.14)}
.tabs-pill button:not(.active):hover{color:${C.text};background:rgba(255,255,255,.04)}

/* HUD-style tab bar (Stitch "Kinetic HUD" inspired) — chamfered glass surface with corner brackets and ambient glow */
.hud-tabs{position:relative;display:flex;align-items:center;gap:2px;padding:6px;background:rgba(24,24,24,.55);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid ${C.border};border-radius:14px;overflow:hidden}
.hud-tabs::before,.hud-tabs::after{content:'';position:absolute;width:12px;height:12px;pointer-events:none}
.hud-tabs::before{top:-1px;left:-1px;border-top:1px solid ${C.primary};border-left:1px solid ${C.primary};border-top-left-radius:14px}
.hud-tabs::after{bottom:-1px;right:-1px;border-bottom:1px solid ${C.primary};border-right:1px solid ${C.primary};border-bottom-right-radius:14px}
.hud-tabs button{position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:9px;background:transparent;color:${C.textSecondary};font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;transition:all .18s;white-space:nowrap}
.hud-tabs button .material-symbols-outlined{font-size:16px}
.hud-tabs button:hover:not(.active){color:#fff;background:rgba(255,255,255,.04)}
.hud-tabs button.active{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.08));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 0 18px rgba(255,255,255,.14)}
.hud-tabs button.active::after{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:${C.primary};box-shadow:0 0 10px ${C.primary};border-radius:1px}
.hud-tabs .hud-spacer{flex:1}
.hud-tabs .hud-meta{display:flex;align-items:center;gap:6px;padding:0 10px;color:${C.textMuted};font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.10em}
.hud-tabs .hud-meta .dot{width:6px;height:6px;border-radius:50%;background:${C.success};box-shadow:0 0 8px ${C.success};animation:pulse 2s infinite}
@media(max-width:768px){.hud-tabs{overflow-x:auto;flex-wrap:nowrap}.hud-tabs .hud-meta{display:none}.hud-tabs button{padding:9px 12px;font-size:10px}.hud-tabs button .material-symbols-outlined{font-size:14px}}

.kicker{font-size:11px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:${C.primary};font-family:'JetBrains Mono',ui-monospace,monospace}
.page-title{font-size:28px;font-weight:800;letter-spacing:-.02em;color:#fff}
.page-subtitle{color:${C.textSecondary};font-size:14px;margin-top:6px}

.list-row{display:flex;align-items:center;gap:14px;padding:14px;background:${C.glass};backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid ${C.border};border-radius:14px;transition:all .2s;cursor:pointer;position:relative;overflow:hidden}
.list-row:hover{border-color:${C.borderRed};transform:translateY(-1px)}

.fab{position:fixed;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;background:${C.primary};color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(255,255,255,.18);z-index:90;border:none;cursor:pointer;transition:transform .2s}
.fab:hover{transform:scale(1.06)}
.fab .material-symbols-outlined{font-size:28px}

a{color:inherit;text-decoration:none}

@media(max-width:768px){
  .hide-mobile{display:none!important}
  .show-mobile{display:flex!important}
  .card{padding:16px;border-radius:14px}
  .modal{padding:18px;border-radius:18px}
  .btn{padding:10px 14px;font-size:13px}
  .grid-dash{grid-template-columns:1fr!important}
  .grid-chart{grid-template-columns:1fr!important}
  .grid-col2{grid-template-columns:1fr!important}
  .grid-col3{grid-template-columns:1fr 1fr!important}
  .page-wrap{padding:16px!important;padding-bottom:96px!important}
  .stat-grid{grid-template-columns:1fr 1fr!important}
  .hide-sm{display:none!important}
  .page-title{font-size:24px}
}
@media(max-width:420px){
  .grid-col3{grid-template-columns:1fr!important}
  .stat-grid{grid-template-columns:1fr 1fr!important}
}
@media(min-width:769px){.show-mobile{display:none!important}}
@media(min-width:769px){.page-wrap{max-width:none!important;margin-left:0!important;margin-right:0!important;width:auto}}

/* ── Onboarding Welcome Slider ───────────────────────────────────────────── */
.ob-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 24%,rgba(255,255,255,.18) 0%,#1E1E1E 70%);z-index:300;overflow:hidden;animation:ob-fade-in .5s ease}
.ob-screen::before{content:'';position:absolute;top:-180px;left:-180px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%);filter:blur(50px);animation:ob-orb 16s ease-in-out infinite;pointer-events:none}
.ob-screen::after{content:'';position:absolute;bottom:-200px;right:-200px;width:540px;height:540px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);filter:blur(60px);animation:ob-orb 22s ease-in-out infinite reverse;pointer-events:none}
@keyframes ob-fade-in{from{opacity:0}to{opacity:1}}
@keyframes ob-orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.12)}}
.ob-slider{position:relative;width:100%;max-width:460px;background:rgba(37,37,38,.74);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.10);border-radius:28px;padding:28px 26px 24px;box-shadow:0 32px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;z-index:1}
.ob-skip{position:absolute;top:18px;right:20px;background:transparent;color:#A0A0A0;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;transition:color .2s,background .2s}
.ob-skip:hover{color:#fff;background:rgba(255,255,255,.06)}
.ob-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;align-self:flex-start}
.ob-brand-mark{width:34px;height:34px;background:#4D4D4D;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 6px 18px rgba(255,255,255,.18)}
.ob-brand-name{font-weight:800;font-size:15px;color:#fff;letter-spacing:-.01em}
.ob-stage{width:100%;position:relative;min-height:380px;overflow:hidden}
.ob-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:translateX(28px);transition:opacity .45s cubic-bezier(.4,0,.2,1),transform .45s cubic-bezier(.4,0,.2,1);pointer-events:none}
.ob-slide.active{opacity:1;transform:translateX(0);pointer-events:auto}
.ob-mockup{width:100%;height:210px;background:linear-gradient(160deg,rgba(14,14,14,.85),rgba(37,37,38,.65));border:1px solid rgba(255,255,255,.06);border-radius:18px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ob-mockup::before{content:'';position:absolute;top:-50%;left:-50%;width:80%;height:80%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 60%);filter:blur(30px);animation:ob-glow 7s ease-in-out infinite;pointer-events:none}
@keyframes ob-glow{0%,100%{transform:translate(0,0)}50%{transform:translate(60%,40%)}}
.ob-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:8px}
.ob-desc{font-size:14px;color:#A0A0A0;line-height:1.55;max-width:340px}
.ob-dots{display:flex;gap:8px;margin:22px 0 18px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;border:none;padding:0;transition:all .25s}

// ── Weather backdrop ─────────────────────────────────────────────────────────
// Calls Open-Meteo with cached coords. Maps WMO weather codes to ambient scenes.
// Scene is rendered behind glass cards (z-index:1; #root is z:2).
const WX_CACHE_KEY='aic_wx_v1';
const WX_TTL=20*60*1000; // 20 min
const wxScene=(code,isDay)=>{
  if(code==null)return{kind:'clear',isDay:!!isDay,label:'Clear'};
  if(code===0||code===1)return{kind:'clear',isDay,label:isDay?'Sunny':'Clear Night'};
  if(code===2)return{kind:'partly',isDay,label:'Partly Cloudy'};
  if(code===3)return{kind:'cloudy',isDay,label:'Overcast'};
  if(code===45||code===48)return{kind:'fog',isDay,label:'Fog'};
  if(code>=51&&code<=57)return{kind:'rain',isDay,label:'Drizzle'};
  if(code>=61&&code<=67)return{kind:'rain',isDay,label:'Rain'};
  if(code>=71&&code<=77)return{kind:'snow',isDay,label:'Snow'};
  if(code>=80&&code<=82)return{kind:'rain',isDay,label:'Showers'};
  if(code===85||code===86)return{kind:'snow',isDay,label:'Snow Showers'};
  if(code>=95)return{kind:'thunder',isDay,label:'Thunderstorm'};
  return{kind:'clear',isDay,label:'Clear'};
};

const WeatherBackdrop=()=>{
  const[wx,setWx]=useState(null);
  useEffect(()=>{
    let cancelled=false;
    const fetchWx=async(lat,lon)=>{
      try{
        const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=weather_code,is_day,temperature_2m,wind_speed_10m`;
        const r=await fetch(u);
        const d=await r.json();
        const c=d?.current;
        if(!c||cancelled)return;
        const scene=wxScene(c.weather_code,c.is_day);
        const result={...scene,temp:Math.round(c.temperature_2m),wind:Math.round(c.wind_speed_10m),lat,lon,ts:Date.now()};
        setWx(result);
        localStorage.setItem(WX_CACHE_KEY,JSON.stringify(result));
      }catch(_){}
    };
    // Try cache first
    try{
      const raw=localStorage.getItem(WX_CACHE_KEY);
      if(raw){
        const cached=JSON.parse(raw);
        if(cached&&Date.now()-cached.ts<WX_TTL){setWx(cached);return;}
      }
    }catch(_){}
    // Geolocate (fallback to NYC)
    const fallback=()=>fetchWx(40.7128,-74.0060);
    if(!navigator.geolocation){fallback();return;}
    navigator.geolocation.getCurrentPosition(
      p=>fetchWx(p.coords.latitude,p.coords.longitude),
      ()=>fallback(),
      {maximumAge:60*60*1000,timeout:6000}
    );
    return()=>{cancelled=true;};
  },[]);

  if(!wx)return null;
  const{kind,isDay,label,temp}=wx;
  const layers=[];
  // Base ambient hue
  layers.push(React.createElement('div',{key:'base',className:'wx '+(isDay?'wx-clear':'wx-night')}));
  // Stars at night for clear/partly
  if(!isDay&&(kind==='clear'||kind==='partly'))layers.push(React.createElement('div',{key:'stars',className:'wx-stars'}));
  // Sun/moon orb for clear or partly
  if(kind==='clear'||kind==='partly')layers.push(React.createElement('div',{key:'sun',className:isDay?'wx-sun':'wx-moon'}));
  // Cloud drift for anything cloudy or worse
  if(['partly','cloudy','rain','snow','thunder','fog'].includes(kind)){
    const dark=['cloudy','rain','thunder'].includes(kind);
    layers.push(React.createElement('div',{key:'c1',className:'wx-cloud c1'+(dark?' dark':'')}));
    layers.push(React.createElement('div',{key:'c2',className:'wx-cloud c2'+(dark?' dark':'')}));
    if(kind!=='partly')layers.push(React.createElement('div',{key:'c3',className:'wx-cloud c3'+(dark?' dark':'')}));
  }
  if(kind==='rain')layers.push(React.createElement('div',{key:'rain',className:'wx-rain'}));
  if(kind==='snow')layers.push(React.createElement('div',{key:'snow',className:'wx-snow'}));
  if(kind==='fog')layers.push(React.createElement('div',{key:'fog',className:'wx-fog'}));
  if(kind==='thunder'){
    layers.push(React.createElement('div',{key:'rain',className:'wx-rain'}));
    layers.push(React.createElement('div',{key:'flash',className:'wx-thunder'}));
  }
  // Status badge bottom-left
  layers.push(React.createElement('div',{key:'badge',className:'wx-badge'},
    React.createElement('span',{className:'material-symbols-outlined',style:{fontSize:14,color:isDay?'#FFCC55':'#9BB0FF'}},
      kind==='rain'?'rainy':kind==='snow'?'cloudy_snowing':kind==='thunder'?'thunderstorm':kind==='fog'?'foggy':kind==='cloudy'?'cloud':kind==='partly'?'partly_cloudy_day':(isDay?'sunny':'bedtime')),
    label,temp!=null?' · '+temp+'°':''));
  return React.createElement(React.Fragment,null,layers);
};

// ── API helper ───────────────────────────────────────────────────────────────
const API_BASE='/api';
// When the vendor licence-locks the deployment, every gated API call returns 503
// { locked, reason }. Broadcast it so the app drops into its lock screen instantly,
// even mid-session, without waiting for the next status poll.
function signalLocked(data){
  try{window.dispatchEvent(new CustomEvent('app-locked',{detail:data||{}}));}catch(e){}
}
async function api(method,path,body,token){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(token)opts.headers['Authorization']=`Bearer ${token}`;
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(API_BASE+path,opts);
  const data=await r.json().catch(()=>({}));
  if(r.status===503&&data&&data.locked){signalLocked(data);throw new Error(data.reason||'Service unavailable');}
  if(!r.ok)throw new Error(data.error||'Request failed');
  return data;
}
async function apiUpload(path,formData,token){
  const r=await fetch(API_BASE+path,{method:'POST',headers:{Authorization:`Bearer ${token}`},body:formData});
  const data=await r.json().catch(()=>({}));
  if(r.status===503&&data&&data.locked){signalLocked(data);throw new Error(data.reason||'Service unavailable');}
  if(!r.ok)throw new Error(data.error||'Upload failed');
  return data;
}

  const s=Math.floor((Date.now()-new Date(d))/1000);

const ReelEmbed=({primaryUrl,name,school,position,sport,token})=>{
  const host=useRef(null);
  const idsRef=useRef([]);
  const triedRef=useRef(null);
  const fetchedRef=useRef(false);
  const pid=ytId(primaryUrl);
  const[currentId,setCurrentId]=useState(pid);
  const[exhausted,setExhausted]=useState(false);

  const advanceRef=useRef(()=>{});
  advanceRef.current=async()=>{
    const next=()=>idsRef.current.find(id=>!triedRef.current.has(id));
    let id=next();
    if(!id&&!fetchedRef.current){
      fetchedRef.current=true;
      try{
        const qs=new URLSearchParams({name:name||'',school:school||'',position:position||'',sport:sport||''}).toString();
        const data=await api('GET','/socials/reels?'+qs,null,token);
        ((data&&data.ids)||[]).forEach(x=>{if(!idsRef.current.includes(x))idsRef.current.push(x);});
      }catch(e){/* fall through to link-out */}
      id=next();
    }
    if(id)setCurrentId(id);else setExhausted(true);
  };

  // (Re)seed the candidate queue whenever the primary reel changes.
  useEffect(()=>{
    idsRef.current=pid?[pid]:[];
    triedRef.current=new Set();
    fetchedRef.current=false;
    setExhausted(false);
    setCurrentId(pid);
    // No explicit YouTube link → auto-find a highlight reel so one always plays.
    if(!pid)advanceRef.current();
  },[pid]);

  useEffect(()=>{
    if(!currentId||!host.current)return;
    if(!idsRef.current.includes(currentId))idsRef.current.push(currentId);
    triedRef.current.add(currentId);
    const mount=document.createElement('div');
    host.current.appendChild(mount);
    let player,dead=false;

      player=new window.YT.Player(mount,{videoId:currentId,width:'100%',height:'100%',
        playerVars:{rel:0,modestbranding:1,playsinline:1},

  },[currentId]);

    return React.createElement('a',{href:fallbackHref,target:'_blank',rel:'noopener noreferrer',style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6,background:'linear-gradient(160deg,#252526,#1C1B1B)',color:C.text,textDecoration:'none'}},
      React.createElement('span',{className:'material-symbols-outlined mi-fill',style:{fontSize:42,color:C.primary}},'play_circle'),

      React.createElement('div',{style:{fontSize:11,color:C.textMuted}},'Opens in a new tab ↗'));
  }
  if(!currentId)return React.createElement('div',{style:{position:'absolute',inset:0,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8,background:'linear-gradient(160deg,#252526,#1C1B1B)',color:C.textMuted}},
    React.createElement('span',{className:'material-symbols-outlined',style:{fontSize:36,color:C.primary}},'smart_display'),
    React.createElement('div',{style:{fontSize:12}},'Finding highlights…'));
  return React.createElement('div',{ref:host,style:{position:'absolute',inset:0,width:'100%',height:'100%'}});

// ── Help & User Manual ────────────────────────────────────────────────────────
// Self-contained CSS-animated walkthroughs replace static GIFs — no external assets.
const HELP_ANIM_CSS=`
@keyframes hlp-slide-in{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes hlp-pulse-ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.18)}70%{box-shadow:0 0 0 14px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@keyframes hlp-cursor{0%,12%{transform:translate(8%,12%);opacity:0}18%{opacity:1}45%{transform:translate(62%,52%)}55%{transform:translate(62%,52%) scale(.85)}65%{transform:translate(62%,52%) scale(1)}90%,100%{transform:translate(62%,52%);opacity:0}}
@keyframes hlp-progress{0%{width:0}55%{width:100%}100%{width:100%}}
@keyframes hlp-coin-pop{0%{transform:translateY(20px) scale(.6);opacity:0}30%{transform:translateY(-8px) scale(1.1);opacity:1}60%{transform:translateY(0) scale(1)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes hlp-deal-stamp{0%,40%{transform:scale(2.4) rotate(-12deg);opacity:0}55%{transform:scale(1.2) rotate(-12deg);opacity:1}70%,100%{transform:scale(1) rotate(-12deg);opacity:1}}
@keyframes hlp-chart-bar{0%{height:8%}100%{height:var(--h)}}
@keyframes hlp-card-shift{0%,30%{transform:translateX(0)}45%{transform:translateX(-110%);opacity:0}46%{transform:translateX(110%);opacity:0}55%{transform:translateX(0);opacity:1}100%{transform:translateX(0)}}
@keyframes hlp-check-draw{0%{stroke-dashoffset:30}60%,100%{stroke-dashoffset:0}}
@keyframes hlp-msg-in{0%,15%{transform:translateY(10px);opacity:0}25%,100%{transform:translateY(0);opacity:1}}
@keyframes hlp-typing{0%,20%{opacity:.2}40%{opacity:1}60%,100%{opacity:.2}}
.hlp-anim{position:relative;height:200px;border-radius:14px;background:linear-gradient(180deg,rgba(20,20,20,.85),rgba(24,24,24,.95));border:1px solid rgba(255,255,255,.08);overflow:hidden}
.hlp-anim-label{position:absolute;top:10px;left:12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.1em;color:#A0A0A0;text-transform:uppercase;z-index:3}
.hlp-anim-dot{position:absolute;top:11px;right:12px;width:7px;height:7px;border-radius:50%;background:#4EC9B0;box-shadow:0 0 8px #4EC9B0;animation:hlp-pulse-ring 1.8s infinite;z-index:3}
.hlp-cursor{position:absolute;width:14px;height:14px;left:0;top:0;animation:hlp-cursor 5s ease-in-out infinite;z-index:5;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.hlp-cursor::before{content:'';position:absolute;inset:0;background:#fff;clip-path:polygon(0 0,100% 50%,40% 60%,55% 100%,40% 100%,28% 70%,0 70%)}
.hlp-card-mock{position:absolute;background:rgba(45,45,48,.72);border:1px solid rgba(255,255,255,.10);border-radius:10px;padding:10px}
.hlp-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;font-size:9px;font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:700;letter-spacing:.05em}
.hlp-bar{position:absolute;bottom:14px;width:18px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#4D4D4D,#333333);animation:hlp-chart-bar 1.8s cubic-bezier(.4,0,.2,1) forwards}
.hlp-roadmap-track{position:relative;padding:8px 0 0}
.hlp-roadmap-track::before{content:'';position:absolute;left:14px;top:24px;bottom:0;width:2px;background:linear-gradient(180deg,#4D4D4D 0%,rgba(255,255,255,.14) 100%)}
.hlp-step-dot{position:absolute;left:7px;top:8px;width:16px;height:16px;border-radius:50%;background:#252526;border:2px solid #4D4D4D;box-shadow:0 0 0 4px rgba(255,255,255,.10)}
.hlp-step-dot.done{background:#4D4D4D}
.hlp-step-dot.done::after{content:'';position:absolute;inset:2px;border-radius:50%;background:#fff;clip-path:polygon(20% 50%,40% 70%,80% 30%,75% 25%,40% 60%,25% 45%)}
.hlp-faq-q{cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(37,37,38,.65);border:1px solid rgba(255,255,255,.08);border-radius:12px;font-weight:600;color:#fff;font-size:14px;transition:border-color .2s}
.hlp-faq-q:hover{border-color:rgba(255,255,255,.18)}
.hlp-faq-a{padding:12px 16px 16px;color:#A0A0A0;font-size:13px;line-height:1.6;animation:hlp-slide-in .25s ease-out}
.hlp-role-tab{flex:1;padding:14px 18px;background:transparent;color:#A0A0A0;font-weight:600;font-size:14px;border-radius:12px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.hlp-role-tab.active{background:#4D4D4D;color:#fff;box-shadow:0 4px 16px rgba(255,255,255,.14)}
.hlp-benefit-card{background:rgba(37,37,38,.65);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:18px;transition:all .25s}
.hlp-benefit-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18);box-shadow:0 8px 24px rgba(255,255,255,.10)}
.hlp-typing-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin:0 1px;animation:hlp-typing 1.4s infinite}
.hlp-typing-dot:nth-child(2){animation-delay:.2s}
.hlp-typing-dot:nth-child(3){animation-delay:.4s}
`;
if(!document.getElementById('hlp-anim-css')){const s=document.createElement('style');s.id='hlp-anim-css';s.textContent=HELP_ANIM_CSS;document.head.appendChild(s);}

const OnboardingScreen=({onDone})=>{
  const[idx,setIdx]=useState(0);

  const finish=()=>{try{localStorage.setItem('as_onboarding_dismissed','1');}catch(e){}onDone&&onDone();};
  const next=()=>{idx<OB_SLIDES.length-1?setIdx(idx+1):finish();};
  const back=()=>{if(idx>0)setIdx(idx-1);};
  useEffect(()=>{
    const onKey=e=>{
      if(e.key==='ArrowRight')next();
      else if(e.key==='ArrowLeft')back();
      else if(e.key==='Escape')finish();
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[idx]);
  const onTouchStart=e=>{touchX.current=e.touches[0].clientX;};

    const dx=e.changedTouches[0].clientX-touchX.current;

      api('GET','/crm/leads',null,token).catch(()=>({leads:[]})),

      .then(s=>setLocked(s.locked?{reason:s.reason}:null))
      .catch(()=>{})
      .finally(()=>setLicChecked(true));

  // lock/unlock so the owner's action takes effect without a manual refresh.

    const poll=()=>api('GET','/system/status').then(s=>setLocked(s.locked?{reason:s.reason}:null)).catch(()=>{});

      case'roster':return React.createElement(Roster,{token,user,onNavigate:setView});
      case'crm':return React.createElement(Crm,{token,user,onNavigate:setView});

      case'talent-marketing':return React.createElement(TalentMarketing,{token,user});
